<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12160F"><meta name="description" content="Homestead personal productivity app">
<link rel="manifest" href="manifest.json">
<title>Homestead</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
*{box-sizing:border-box}body{margin:0;background:#12160F;color:#F2EFE6;font-family:Inter,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{position:sticky;top:0;z-index:10;background:#1B211A;border-bottom:1px solid #333D2E;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font:600 22px Fraunces;color:#E8B93E}.layout{display:flex;max-width:1180px;margin:auto}.side{width:245px;flex:none;min-height:calc(100vh - 57px);background:#1B211A;border-right:1px solid #333D2E;padding:22px 12px;position:sticky;top:57px}.main{flex:1;padding:24px;max-width:900px}.nav{width:100%;padding:11px 12px;border:0;background:transparent;color:#9BA593;text-align:left;border-radius:9px;margin:2px 0}.nav.active{background:#212A1D;color:#E8B93E}.card{background:#1B211A;border:1px solid #333D2E;border-radius:10px;padding:16px;margin-bottom:12px}.hero{padding:22px;border-radius:12px;background:#1B211A;border:1px solid #333D2E;margin-bottom:18px}.eyebrow{font:12px 'JetBrains Mono';letter-spacing:.12em;text-transform:uppercase;color:#E8B93E}.h1{font:32px Fraunces;margin:5px 0}.muted{color:#9BA593;font-size:13px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.input{width:100%;background:#212A1D;border:1px solid #333D2E;color:#F2EFE6;padding:10px 12px;border-radius:7px;outline:none}.btn{border:0;border-radius:7px;padding:10px 13px;background:#E8B93E;color:#12160F;font-weight:600}.ghost{background:transparent;color:#F2EFE6;border:1px solid #333D2E}.danger{color:#C1502E;background:transparent;border:0}.progress{height:8px;background:#212A1D;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:#E8B93E}.small{font-size:12px}.tile{background:#1B211A;border:1px solid #333D2E;border-radius:9px;padding:14px;text-align:left}.big{font:28px Fraunces;color:#E8B93E}.list{display:flex;align-items:center;gap:10px}.check{width:24px;height:24px;border-radius:6px;border:1px solid #333D2E;background:transparent;color:#12160F}.check.on{background:#7FA07E;border-color:#7FA07E}.range{width:100%;accent-color:#E8B93E}.days{display:flex;gap:5px}.day{width:30px;height:30px;border-radius:50%;border:0;background:#212A1D;color:#9BA593}.day.on{background:#E8B93E;color:#12160F}.tabs{display:flex;gap:7px;margin-bottom:12px}.pill{border:0;border-radius:99px;padding:7px 12px;background:#212A1D;color:#9BA593}.pill.on{background:#E8B93E;color:#12160F}.mobileNav{display:none}
@media(max-width:760px){.layout{display:block}.side{position:fixed;z-index:30;left:0;top:57px;bottom:0;transform:translateX(-105%);transition:.2s;width:260px;min-height:0}.side.open{transform:none}.mobileNav{display:block}.main{padding:18px 14px}.grid2,.grid3,.grid4{grid-template-columns:1fr 1fr}.grid3 .card,.grid4 .card{min-width:0}.h1{font-size:28px}.desktopOnly{display:none!important}}
@media(max-width:450px){.grid2,.grid3,.grid4{grid-template-columns:1fr}.row.stack{flex-direction:column;align-items:stretch}.main{padding:14px}.hero{padding:17px}}
</style>
</head>
<body><div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;
const C={gold:'#E8B93E',sage:'#7FA07E',rust:'#C1502E',text:'#F2EFE6',muted:'#9BA593'};
const uid=()=>Math.random().toString(36).slice(2,10), today=()=>new Date().toISOString().slice(0,10), fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';
const load=(k,f)=>{try{return JSON.parse(localStorage.getItem('homestead-'+k))??f}catch{return f}}, save=(k,v)=>localStorage.setItem('homestead-'+k,JSON.stringify(v));
function Card({children}){return <div className="card">{children}</div>};
function Btn({children,onClick,ghost=false}){return <button className={'btn '+(ghost?'ghost':'')} onClick={onClick}>{children}</button>};
function Input(p){return <input {...p} className={'input '+(p.className||'')}/>};
function Progress({v}){return <div className="progress"><i style={{width:Math.max(0,Math.min(100,v))+'%'}}/></div>};
const NAV=[['dashboard','⌂','Dashboard'],['routine','☀','Daily Routine'],['todos','✓','To-Do List'],['goals','◎','Goal Tracker'],['habits','🔥','Habit Tracker'],['life','↗','Life Progress'],['courses','🎓','Course Tracker'],['growth','▥','Completion Calculator']];
function Header({open,setOpen}){return <div className="top"><div className="brand">Homestead</div><button className="btn ghost mobileNav" onClick={()=>setOpen(!open)}>☰</button></div>}
function Dashboard({d,go}){let t=today(),rt=d.routine.filter(x=>x.days.includes(new Date().getDay())),rd=rt.filter(x=>x.doneDates.includes(t)).length,open=d.todos.filter(x=>!x.done),hab=d.habits.filter(x=>x.logs.includes(t)).length;let goal=d.goals.length?Math.round(d.goals.reduce((a,x)=>a+x.progress,0)/d.goals.length):null;let last14=Array.from({length:14},(_,i)=>{let x=new Date();x.setDate(x.getDate()-i);return x.toISOString().slice(0,10)});let hp=d.habits.length?Math.round(d.habits.reduce((a,h)=>a+h.logs.filter(x=>last14.includes(x)).length/14*100,0)/d.habits.length):null;let cp=d.courses.length?Math.round(d.courses.reduce((a,c)=>a+(c.modules.length?c.modules.filter(m=>m.done).length/c.modules.length*100:0),0)/d.courses.length):null;let vals=[goal,hp,cp].filter(x=>x!==null),overall=vals.length?Math.round(vals.reduce((a,x)=>a+x,0)/vals.length):0;return <><div className="hero"><div className="eyebrow">{new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div><div className="h1">Every good number is a habit, kept.</div></div><Card><div className="row"><div className="big">{overall}%</div><div className="grow"><b>Overall progress</b><div className="muted">Auto-calculated from Goals, Habits & Courses</div><Progress v={overall}/></div></div><div className="grid3" style={{marginTop:15}}>{[['Goals',goal,'goals'],['Habits',hp,'habits'],['Courses',cp,'courses']].map(x=><button className="tile" key={x[0]} onClick={()=>go(x[2])}><div className="muted">{x[0]}</div><div className="big">{x[1]===null?'—':x[1]+'%'}</div><Progress v={x[1]||0}/></button>)}</div></Card><div className="grid4">{[['☀','Routine today',rd+'/'+rt.length,'routine'],['✓','Open to-dos',open.length,'todos'],['🔥','Habits checked in',hab+'/'+d.habits.length,'habits'],['↗','Life areas tracked',d.life.length,'life']].map(x=><button className="tile" key={x[1]} onClick={()=>go(x[3])}><div style={{fontSize:22}}>{x[0]}</div><div className="big">{x[2]}</div><div className="muted">{x[1]}</div></button>)}</div></>}
function Section({eyebrow,title,sub}){return <div style={{marginBottom:18}}><div className="eyebrow">{eyebrow}</div><div className="h1">{title}</div><div className="muted">{sub}</div></div>}
function Routine({items,set}){let [title,setTitle]=useState(''),[time,setTime]=useState('07:00'),[days,setDays]=useState([0,1,2,3,4,5,6]),t=today(),todayN=new Date().getDay();return <><Section eyebrow="Every day" title="Daily Routine" sub="Recurring anchors for your day, checked off as you go."/><Card><div className="row stack"><Input placeholder="e.g. Morning feed round" value={title} onChange={e=>setTitle(e.target.value)}/><Input type="time" value={time} onChange={e=>setTime(e.target.value)}/><Btn onClick={()=>{if(title.trim()){set([...items,{id:uid(),title:title.trim(),time,days,doneDates:[]}]);setTitle('')}}}>＋ Add</Btn></div><div className="days" style={{marginTop:10}}>{['S','M','T','W','T','F','S'].map((x,i)=><button className={'day '+(days.includes(i)?'on':'')} onClick={()=>setDays(days.includes(i)?days.filter(a=>a!==i):[...days,i])} key={i}>{x}</button>)}</div></Card>{[...items].sort((a,b)=>a.time.localeCompare(b.time)).map(r=>{let active=r.days.includes(todayN),done=r.doneDates.includes(t);return <Card key={r.id}><div className="list"><button disabled={!active} className={'check '+(done?'on':'')} onClick={()=>set(items.map(x=>x.id===r.id?{...x,doneDates:done?x.doneDates.filter(y=>y!==t):[...x.doneDates,t]}:x))}>{done?'✓':''}</button><span style={{color:C.gold,fontFamily:'JetBrains Mono'}}>{r.time}</span><span className="grow" style={{textDecoration:done?'line-through':'none'}}>{r.title}</span><button className="danger" onClick={()=>set(items.filter(x=>x.id!==r.id))}>🗑</button></div></Card>})}</>}
function Todos({items,set}){let [title,setTitle]=useState(''),[due,setDue]=useState(''),[priority,setPriority]=useState('medium'),[filter,setFilter]=useState('open');let shown=items.filter(x=>filter==='open'?!x.done:filter==='done'?x.done:true).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));return <><Section eyebrow="Get it done" title="To-Do List" sub="One-off tasks, prioritized and dated."/><Card><div className="row stack"><Input placeholder="What needs doing?" value={title} onChange={e=>setTitle(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()}/><Input type="date" value={due} onChange={e=>setDue(e.target.value)}/><select className="input" value={priority} onChange={e=>setPriority(e.target.value)}><option>high</option><option>medium</option><option>low</option></select><Btn onClick={add}>＋ Add</Btn></div></Card><div className="tabs">{['open','done','all'].map(f=><button className={'pill '+(filter===f?'on':'')} onClick={()=>setFilter(f)} key={f}>{f}</button>)}</div>{shown.map(x=><Card key={x.id}><div className="list"><button className={'check '+(x.done?'on':'')} onClick={()=>set(items.map(a=>a.id===x.id?{...a,done:!a.done}:a))}>{x.done?'✓':''}</button><span style={{color:x.priority==='high'?C.rust:x.priority==='low'?C.sage:C.gold}}>●</span><span className="grow" style={{textDecoration:x.done?'line-through':'none',opacity:x.done?.5:1}}>{x.title}</span>{x.due&&<span className="muted">{fmt(x.due)}</span>}<button className="danger" onClick={()=>set(items.filter(a=>a.id!==x.id))}>🗑</button></div></Card>)}{!shown.length&&<div className="muted">Nothing here.</div>}</>;
function add(){/* replaced per render via closure below */}
function TodosWrapper(p){let [title,setTitle]=useState(''),[due,setDue]=useState(''),[priority,setPriority]=useState('medium'),[filter,setFilter]=useState('open');let shown=p.items.filter(x=>filter==='open'?!x.done:filter==='done'?x.done:true).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));let add=()=>{if(title.trim()){p.set([{id:uid(),title:title.trim(),due,priority,done:false},...p.items]);setTitle('');setDue('')}};return <><Section eyebrow="Get it done" title="To-Do List" sub="One-off tasks, prioritized and dated."/><Card><div className="row stack"><Input placeholder="What needs doing?" value={title} onChange={e=>setTitle(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()}/><Input type="date" value={due} onChange={e=>setDue(e.target.value)}/><select className="input" value={priority} onChange={e=>setPriority(e.target.value)}><option>high</option><option>medium</option><option>low</option></select><Btn onClick={add}>＋ Add</Btn></div></Card><div className="tabs">{['open','done','all'].map(f=><button className={'pill '+(filter===f?'on':'')} onClick={()=>setFilter(f)} key={f}>{f}</button>)}</div>{shown.map(x=><Card key={x.id}><div className="list"><button className={'check '+(x.done?'on':'')} onClick={()=>p.set(p.items.map(a=>a.id===x.id?{...a,done:!a.done}:a))}>{x.done?'✓':''}</button><span style={{color:x.priority==='high'?C.rust:x.priority==='low'?C.sage:C.gold}}>●</span><span className="grow" style={{textDecoration:x.done?'line-through':'none',opacity:x.done?.5:1}}>{x.title}</span>{x.due&&<span className="muted">{fmt(x.due)}</span>}<button className="danger" onClick={()=>p.set(p.items.filter(a=>a.id!==x.id))}>🗑</button></div></Card>)}</>}
function Goals({items,set}){let [title,setTitle]=useState(''),[target,setTarget]=useState('');return <><Section eyebrow="Aim true" title="Goal Tracker" sub="Bigger targets, broken into milestones."/><Card><div className="row stack"><Input placeholder="Goal title" value={title} onChange={e=>setTitle(e.target.value)}/><Input type="date" value={target} onChange={e=>setTarget(e.target.value)}/><Btn onClick={()=>{if(title.trim()){set([{id:uid(),title:title.trim(),target,progress:0,milestones:[]},...items]);setTitle('');setTarget('')}}}>＋ Add</Btn></div></Card>{items.map(g=><Card key={g.id}><div className="list"><span className="grow" style={{fontFamily:'Fraunces',fontSize:19}}>{g.title}</span><span style={{color:C.gold}}>{g.progress}%</span><button className="danger" onClick={()=>set(items.filter(x=>x.id!==g.id))}>🗑</button></div>{g.target&&<div className="muted">Target {fmt(g.target)}</div>}<Progress v={g.progress}/><input className="range" type="range" min="0" max="100" value={g.progress} onChange={e=>set(items.map(x=>x.id===g.id?{...x,progress:+e.target.value}:x))}/></Card>)}</>}
function Habits({items,set}){let t=today(),last=Array.from({length:14},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(13-i));return d.toISOString().slice(0,10)}),[name,setName]=useState('');let streak=h=>{let s=0,d=new Date();while(h.logs.includes(d.toISOString().slice(0,10))){s++;d.setDate(d.getDate()-1)}return s};return <><Section eyebrow="Consistency compounds" title="Habit Tracker" sub="Daily check-ins and streaks, last 14 days."/><Card><div className="row"><Input placeholder="e.g. Record morning feed weight" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&name.trim()){set([...items,{id:uid(),name:name.trim(),logs:[]}]);setName('')}}}/><Btn onClick={()=>{if(name.trim()){set([...items,{id:uid(),name:name.trim(),logs:[]}]);setName('')}}}>＋ Add</Btn></div></Card>{items.map(h=><Card key={h.id}><div className="list"><span className="grow">🔥 {h.name}</span><span style={{color:C.gold}}>{streak(h)}d streak</span><button className="danger" onClick={()=>set(items.filter(x=>x.id!==h.id))}>🗑</button></div><div style={{display:'grid',gridTemplateColumns:'repeat(14,1fr)',gap:4,marginTop:12}}>{last.map(d=><button key={d} title={d} onClick={()=>set(items.map(x=>x.id===h.id?{...x,logs:x.logs.includes(d)?x.logs.filter(a=>a!==d):[...x.logs,d]}:x))} style={{aspectRatio:1,border:'0',borderRadius:4,background:h.logs.includes(d)?C.sage:'#212A1D'}}/>)}</div></Card>)}</>}
function Life({items,set}){let [name,setName]=useState('');useEffect(()=>{if(!items.length)set(['Health & Fitness','Career / Farm Business','Finance','Relationships','Personal Growth','Recreation'].map(n=>({id:uid(),name:n,score:5,note:''})))},[]);let overall=items.length?Math.round(items.reduce((a,x)=>a+x.score,0)/(items.length*10)*100):0;return <><Section eyebrow="The whole picture" title="Life Progress Tracker" sub="Rate each area of life 0–10 and watch the balance."/><Card><div className="big">{overall}%</div><Progress v={overall}/></Card>{items.map(a=><Card key={a.id}><div className="list"><span className="grow">{a.name}</span><span style={{color:C.gold}}>{a.score}/10</span><button className="danger" onClick={()=>set(items.filter(x=>x.id!==a.id))}>🗑</button></div><input className="range" type="range" min="0" max="10" value={a.score} onChange={e=>set(items.map(x=>x.id===a.id?{...x,score:+e.target.value}:x))}/><Input placeholder="Notes (optional)" value={a.note} onChange={e=>set(items.map(x=>x.id===a.id?{...x,note:e.target.value}:x))}/></Card>)}<Card><div className="row"><Input placeholder="Add a life area" value={name} onChange={e=>setName(e.target.value)}/><Btn onClick={()=>{if(name.trim()){set([...items,{id:uid(),name:name.trim(),score:5,note:''}]);setName('')}}}>＋ Add</Btn></div></Card></>}
function Courses({items,set}){let [title,setTitle]=useState(''),[provider,setProvider]=useState(''),[open,setOpen]=useState(null);return <><Section eyebrow="Keep learning" title="Course Tracker" sub="Track modules and completion for anything you're studying."/><Card><div className="row stack"><Input placeholder="Course title" value={title} onChange={e=>setTitle(e.target.value)}/><Input placeholder="Provider (optional)" value={provider} onChange={e=>setProvider(e.target.value)}/><Btn onClick={()=>{if(title.trim()){set([{id:uid(),title:title.trim(),provider,modules:[]},...items]);setTitle('');setProvider('')}}}>＋ Add</Btn></div></Card>{items.map(c=>{let pct=c.modules.length?Math.round(c.modules.filter(m=>m.done).length/c.modules.length*100):0;return <Card key={c.id}><div className="list"><button className="danger" onClick={()=>setOpen(open===c.id?null:c.id)}>{open===c.id?'▼':'▶'}</button><span className="grow" style={{fontFamily:'Fraunces',fontSize:19}}>{c.title}<small className="muted"> {c.provider}</small></span><span style={{color:C.gold}}>{pct}%</span><button className="danger" onClick={()=>set(items.filter(x=>x.id!==c.id))}>🗑</button></div><Progress v={pct}/>{open===c.id&&<div style={{marginTop:10}}>{c.modules.map(m=><div className="list" key={m.id} style={{padding:'5px 0'}}><button className={'check '+(m.done?'on':'')} onClick={()=>set(items.map(x=>x.id===c.id?{...x,modules:x.modules.map(y=>y.id===m.id?{...y,done:!y.done}:y)}:x))}>{m.done?'✓':''}</button><span className="grow">{m.title}</span><button className="danger" onClick={()=>set(items.map(x=>x.id===c.id?{...x,modules:x.modules.filter(y=>y.id!==m.id)}:x))}>×</button></div>)}<ModuleAdd onAdd={text=>set(items.map(x=>x.id===c.id?{...x,modules:[...x.modules,{id:uid(),title:text,done:false}]}:x))}/></div>}</Card>})}</>}
function ModuleAdd({onAdd}){let [v,setV]=useState('');return <div className="row" style={{marginTop:8}}><Input placeholder="Add module" value={v} onChange={e=>setV(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&v.trim()){onAdd(v.trim());setV('')}}}/><Btn onClick={()=>{if(v.trim()){onAdd(v.trim());setV('')}}}>＋</Btn></div>}
function Growth(){let [course,setCourse]=useState(''),[daily,setDaily]=useState(''),[days,setDays]=useState('7');let sessions=+daily?+course/+daily:0,cal=sessions?Math.ceil(sessions/(+days||7)*7):0;let finish=cal?(()=>{let d=new Date();d.setDate(d.getDate()+cal);return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})})():'';return <><Section eyebrow="Plan the finish" title="Course Completion Calculator" sub="How many days to finish a course, given your free hours per day."/><Card><div className="grid3"><div><label className="muted">Course length (hours)</label><Input type="number" value={course} onChange={e=>setCourse(e.target.value)}/></div><div><label className="muted">Free time (hours/day)</label><Input type="number" value={daily} onChange={e=>setDaily(e.target.value)}/></div><div><label className="muted">Study days/week</label><Input type="number" min="1" max="7" value={days} onChange={e=>setDays(e.target.value)}/></div></div><div className="grid3" style={{marginTop:12}}><Card><div className="muted">Days to Complete</div><div className="big">{cal||'—'}</div></Card><Card><div className="muted">In weeks</div><div className="big">{cal?(cal/7).toFixed(1):'—'}</div></Card><Card><div className="muted">Estimated finish</div><div className="big" style={{fontSize:20}}>{finish||'—'}</div></Card></div></Card></>}
function App(){let [tab,setTab]=useState('dashboard'),[open,setOpen]=useState(false);let [routine,setRoutine]=useState(load('routine',[])),[todos,setTodos]=useState(load('todos',[])),[goals,setGoals]=useState(load('goals',[])),[habits,setHabits]=useState(load('habits',[])),[life,setLife]=useState(load('life',[])),[courses,setCourses]=useState(load('courses',[]));[[routine,'routine'],[todos,'todos'],[goals,'goals'],[habits,'habits'],[life,'life'],[courses,'courses']].forEach(([v,k])=>useEffect(()=>save(k,v),[v]));let go=x=>{setTab(x);setOpen(false)};return <div className="app"><Header open={open} setOpen={setOpen}/><div className="layout"><aside className={'side '+(open?'open':'')}><div className="brand desktopOnly" style={{padding:'0 10px 18px'}}>Homestead</div>{NAV.map(n=><button key={n[0]} className={'nav '+(tab===n[0]?'active':'')} onClick={()=>go(n[0])}>{n[1]} &nbsp; {n[2]}</button>)}</aside><main className="main">{tab==='dashboard'&&<Dashboard d={{routine,todos,goals,habits,life,courses}} go={go}/>} {tab==='routine'&&<Routine items={routine} set={setRoutine}/>} {tab==='todos'&&<TodosWrapper items={todos} set={setTodos}/>} {tab==='goals'&&<Goals items={goals} set={setGoals}/>} {tab==='habits'&&<Habits items={habits} set={setHabits}/>} {tab==='life'&&<Life items={life} set={setLife}/>} {tab==='courses'&&<Courses items={courses} set={setCourses}/>} {tab==='growth'&&<Growth/>}</main></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script>
</body></html>
